schema_version: 1
tool_version: v2.1.0
tool_checksums_sha256: 5517b5ec9872ad51546409de37b2932a90f230c673570998f8696416b149e5c6
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: go-doc
    path: api/v1.txt
    packages:
    - "."
    - ./manual
    - ./clocktest
operations:
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["./manual"]
    run: '^Test(ConcurrentAdvanceResetStopWaitCallbackCancelAndShutdown|ConcurrentCloseAndShutdownWakeEverySleeperOnce|CallbackCanReenterClockWithoutInternalLock|ShutdownReleasesOwnedWork)$'
    race: true
    count: 1
    timeout: 2m
- module: "."
  gate: test
  steps:
  - type: go-test
    packages: ["./manual"]
    run: 'Concurrent|Reenter|Shutdown|Waiter|Panic|WorkLimit'
    count: 20
    timeout: 20m
  - type: go-test
    packages: ["./manual"]
    run: 'Leak|WorkLimitDrains'
    count: 10
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["./manual"]
    fuzz: '^FuzzLifecycleSequences$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./manual"]
    fuzz: '^FuzzAdvanceDurations$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./manual"]
    fuzz: '^FuzzCallbackCancellationAndLimits$'
    budget: 10000x
    timeout: 2m
- module: "."
  gate: docs
  steps:
  - type: go-test
    packages: ["./..."]
    run: '^Example'
    timeout: 20m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
