schema_version: 1
tool_version: v1.3.0
tool_checksums_sha256: 72d38d7d0cab33bfeb9345df6b141eacf9841c5d6817f597ff25b957dc8dc48f
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: go-doc
    path: api/v1.txt
    packages:
    - "."
    - ./manual
    - ./clocktest
operations:
- module: "."
  gate: test
  steps:
  - type: go-test
    packages: ["./manual"]
    run: 'Concurrent|Reenter|Shutdown|Waiter|Panic|WorkLimit'
    count: 20
    timeout: 20m
  - type: go-test
    packages: ["./manual"]
    run: 'Leak|WorkLimitDrains'
    count: 10
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["./manual"]
    fuzz: '^FuzzLifecycleSequences$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./manual"]
    fuzz: '^FuzzAdvanceDurations$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./manual"]
    fuzz: '^FuzzCallbackCancellationAndLimits$'
    budget: 10000x
    timeout: 2m
- module: "."
  gate: docs
  steps:
  - type: go-test
    packages: ["./..."]
    run: '^Example'
    timeout: 20m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
