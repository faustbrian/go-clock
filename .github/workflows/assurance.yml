name: Selected assurance

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      fuzz_target:
        description: Exact declared fuzz selector, for example ^FuzzLifecycleSequences$
        required: true
        type: string

permissions:
  contents: read

jobs:
  assurance:
    uses: faustbrian/go-library-tools/.github/workflows/library-assurance.yml@19b3394729db02c823fadf127398c1ffcb101760
    with:
      tooling_sha: df42d70bd91cc947c93265f237d5387246bac88e
      fuzz_target: ${{ inputs.fuzz_target || '' }}
